[repo]
kind = "processed-target"

# This is auto generated at the root of a Starbash target processing tree
# it is initially auto populated based on the best guess of starbash, but you
# can customize as needed.  Any changes you make to this file will be preserved/used
# in future runs.

# The stages used to process this target are recorded below as a [[stages]]
# array. Each entry has a name; add `excluded = true` to skip a stage, and
# uncomment a value under [[stages.overrides]] to override a recipe parameter.
# Starbash regenerates/augments this list on every run.

[[stages]]
name = "master_dark" # Generate master dark

[[stages]]
name = "master_bias" # Generate master bias

[[stages]]
name = "master_flat" # Generate master flat

[[stages]]
name = "light_vs_bias" # Extract OSC light calibrated vs bias

[[stages.overrides]]
name = "options" # Light frame calibration options for OSC cameras
# value = "-cfa -equalize_cfa"

[[stages]]
name = "light_vs_dark" # Extract OSC light calibrated vs dark

[[stages.overrides]]
name = "options" # Light frame calibration options for OSC cameras
# value = "-cfa -equalize_cfa"

[[stages]]
name = "light_no_darks" # Calibrate OSC lights that have no dark frames available

[[stages.overrides]]
name = "options" # Light frame calibration options for OSC cameras
# value = "-cfa -equalize_cfa"

[[stages]]
name = "stack_osc" # Basic OSC stacking (no fancy narrowband extraction)

[[stages.overrides]]
name = "registration" # Registration options for Siril stacking
# value = "rej w 3 3"

[[stages.overrides]]
name = "filtering" # Filtering options for Siril (controls which frames are accepted for stacking) add -filter-round=80% -filter-bkg=80% for best results
# value = "-filter-wfwhm=80%"

[[stages.overrides]]
name = "drizzle" # Drizzle option for Siril stacking, set to empty string to disable, or -drizzle to enable
# value = ""

[[stages.overrides]]
name = "options" # Misc options for Siril stacking
# value = "-norm=addscale -output_norm -rgb_equal -32b"

[[stages.overrides]]
name = "framing" # Framing option for Siril stacking min/max/cog are recommended. cog requires all images to have same dimensions, so min/max is a safer default.
# value = "max"

[[stages]]
name = "seqextract_haoiii" # Extract OSC HaOiii channels

[[stages]]
name = "stack_dual_duo" # Stack OSC dual duo (HaOiii + SiiOiii) filter data: with separate Ha, Oiii and Sii channels

[[stages.overrides]]
name = "drizzle" # Drizzle option for Siril seqapplyreg, set to empty string to disable, or -drizzle to enable
# value = "-drizzle"

[[stages.overrides]]
name = "framing" # Framing option for Siril seqapplyreg min/max/cog are recommended.
# value = "cog"

[[stages.overrides]]
name = "filtering" # Filtering options for Siril seqapplyreg (controls which frames are accepted for stacking). add -filter-round=80% -filter-bkg=80% for better results, but possibly too much rejection.
# value = "-filter-wfwhm=80% -filter-round=80% -filter-bkg=80%"

[[stages]]
name = "stack_single_duo" # Stack OSC single duo (HaOiii) filter data: with separate Ha and Oiii channels

[[stages.overrides]]
name = "drizzle" # Drizzle option for Siril seqapplyreg, set to empty string to disable, or -drizzle to enable
# value = "-drizzle"

[[stages.overrides]]
name = "framing" # Framing option for Siril seqapplyreg min/max/cog are recommended.
# value = "cog"

[[stages.overrides]]
name = "filtering" # Filtering options for Siril seqapplyreg (controls which frames are accepted for stacking)
# value = "-filter-wfwhm=80% -filter-round=80% -filter-bkg=80%"

[[stages]]
name = "background" # Do background subtraction with graxpert

[[stages.overrides]]
name = "smoothing_option" # Smoothing option for graxpert background extraction
# value = 0.5

[[stages.overrides]]
name = "ai_version" # AI version for graxpert background extraction
# value = "1.0.1"

[[stages]]
name = "deconv-obj" # Do object deconvolution with graxpert
excluded = true

[[stages]]
name = "blur_exterminator" # Sharpen/deconvolve with BlurXTerminator (rc-astro bxt)

[[stages.overrides]]
name = "sharpen_stars" # BlurXTerminator stellar sharpening strength (0..1)
# value = 0.5

[[stages.overrides]]
name = "sharpen_nonstellar" # BlurXTerminator non-stellar sharpening strength (0..1)
# value = 0.5

[[stages]]
name = "denoise" # Do denoising with graxpert
excluded = true

[[stages]]
name = "noise_exterminator" # Denoise with NoiseXTerminator (rc-astro nxt)

[[stages.overrides]]
name = "denoise" # NoiseXTerminator overall denoise strength (0..1)
# value = 0.9

[[stages.overrides]]
name = "denoise_intensity" # NoiseXTerminator intensity denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_color" # NoiseXTerminator chrominance denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_hf" # NoiseXTerminator high-frequency (small scale) denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_lf" # NoiseXTerminator low-frequency (large scale) denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_intensity_hf" # NoiseXTerminator high-frequency intensity denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_intensity_lf" # NoiseXTerminator low-frequency intensity denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_color_hf" # NoiseXTerminator high-frequency color denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "denoise_color_lf" # NoiseXTerminator low-frequency color denoise strength (0..1)
# value = 

[[stages.overrides]]
name = "frequency_scale" # Pixel scale of the low/high frequency transition band (1..100)
# value = 

[[stages.overrides]]
name = "iterations" # Number of denoising iterations (1..5)
# value = 2

[[stages]]
name = "palette_sho" # SHO palette: R=Ha, G=Sii-or-synthetic, B=OIII

[[stages.overrides]]
name = "ha_weight" # Ha contribution when synthesizing the green channel (0..1)
# value = 0.4

[[stages.overrides]]
name = "oiii_weight" # OIII contribution when synthesizing the green channel (0..1)
# value = 0.6

[[stages]]
name = "palette_hoo" # HOO palette: R=Ha, G=OIII (optionally blended with Ha), B=OIII

[[stages.overrides]]
name = "green_ha_weight" # Ha contribution mixed into the green (OIII) channel (0..1); 0 = pure OIII green
# value = 0.0

[[stages]]
name = "starnet" # Star removal with StarNet via Siril
excluded = true

[[stages.overrides]]
name = "params" # Options passed to the Siril 'starnet' command (e.g. -stretch, -upscale, -stride=value)
# value = "-stretch"

[[stages]]
name = "veralux" # Do VeraLux HyperMetric Stretching

[[stages.overrides]]
name = "background" # What background level should be targeted for VeraLux HyperMetric Stretch
# value = 0.1

[[stages.overrides]]
name = "log_d" # Stretch (Log D): hyperbolic intensity. Higher = brighter midtones.
# value = 

[[stages.overrides]]
name = "protect_b" # Highlight Protection (b): controls the stretch curve 'knee'. Higher (>6.0) protects stars from bloating; lower (<2.0) gives brighter highlights but risks bloating.
# value = 

[[stages.overrides]]
name = "star_recovery" # Star Recovery (White Point): color convergence. Determines how fast a saturated core fades to pure white; increase to fix 'donut' artifacts or holes in stars.
# value = 

[[stages.overrides]]
name = "color_grip" # Color Grip: vector strictness in highlights. 1.0 = pure vector (vivid); < 1.0 = hybrid (softer stars).
# value = 

[[stages]]
name = "merge_stars" # Screen-blend the removed stars back into the stretched starless image

[[stages.overrides]]
name = "stretch" # asinh stretch factor applied to the linear starmask before blending (higher = more stars visible)
# value = 1000.0

[[stages]]
name = "thumbnail" # Generate a stretched thumbnail image

[[stages.overrides]]
name = "size" # Maximum dimension for the thumbnail image
# value = 1600

[[stages.overrides]]
name = "quality" # Quality setting for the thumbnail image (1-100)
# value = 95

[[stages]]
name = "crop" # Crop and rotate stacked FITS outputs

[[stages.overrides]]
name = "crop_width" # Maximum crop width, in pixels or as a percentage of the source width
value = "60%"

[[stages.overrides]]
name = "crop_height" # Maximum crop height, in pixels or as a percentage of the source height
value = "60%"

[[stages.overrides]]
name = "rotate_deg" # Rotation angle in degrees after cropping
# value = 0

[[stages]]
name = "report_stack_osc" # Record per-frame registration metrics for basic OSC stacks

[[stages.overrides]]
name = "seq_basename" # Registered sequence basename in process_dir (without _.seq suffix). stack_osc stacks r_osc, so r_osc_.seq carries the registration rows.
# value = "r_osc"

[[stages]]
name = "report_duo" # Record per-frame registration metrics for duo stacks

[[stages.overrides]]
name = "seq_basename" # Registered sequence basename in process_dir (without _.seq suffix)
# value = "r_all_ha"

[[stages]]
name = "palette_broadband" # Broadband palette: load the denoised broadband stack and save it as broadband.fits

[[stages]]
name = "astro_color_stretch" # astro-color-stretch (ACS): per-channel zero-sky black point, stretch, colour restore

[[stages.overrides]]
name = "stretch_type" # Stretch family: 0 = none, 1 = root-power (default), 2 = asinh, 3 = logarithmic
# value = 1

[[stages.overrides]]
name = "rootiter" # Number of root-power stretch passes: 1 or 2. Pass 2 uses rootpower2
# value = 1

[[stages.overrides]]
name = "rootpower" # Root-power stretch strength: 1-600. Higher = more stretch (rootpower)
# value = 20

[[stages.overrides]]
name = "rootpower2" # Root-power stretch strength for the optional 2nd pass: 1-600 (rootpower2, used when rootiter = 2)
# value = 2

[[stages.overrides]]
name = "asinhiter" # Number of asinh stretch passes: 1 or 2. Pass 2 uses k2
# value = 1

[[stages.overrides]]
name = "k1" # Asinh stretch strength (guide: K1): 1-1000. Higher = more stretch
# value = 100

[[stages.overrides]]
name = "k2" # Asinh stretch strength for the optional 2nd pass (guide: K2): 1-1000, used when asinhiter = 2
# value = 5

[[stages.overrides]]
name = "logiter" # Number of logarithmic stretch passes: 1 or 2. Pass 2 uses log_k2
# value = 1

[[stages.overrides]]
name = "log_k1" # Logarithmic stretch strength (guide: logK1): 1-500. Higher = more stretch
# value = 100

[[stages.overrides]]
name = "log_k2" # Logarithmic stretch strength for the optional 2nd pass (guide: logK2): 1-500, used when logiter = 2
# value = 5

[[stages.overrides]]
name = "skylevelfactor" # Where the sky level sits relative to the histogram peak, as a fraction of peak height. 0.06 is the 'for most cases' value
# value = 0.06

[[stages.overrides]]
name = "zeroskyred" # Desired sky zero point for the red channel, in DN out of 65535. 4096 is the 'for most cases' value; lower it for a darker red sky
# value = 4096

[[stages.overrides]]
name = "zeroskygreen" # Desired sky zero point for the green channel, in DN out of 65535. 0-25000
# value = 4096

[[stages.overrides]]
name = "zeroskyblue" # Desired sky zero point for the blue channel, in DN out of 65535. Raise it when light pollution or moonlight tints the sky blue
# value = 4096

[[stages.overrides]]
name = "rgbskyzero_method" # Histogram box used to find the sky level: 0 = full image (default), 1 = auto-scan for the darkest window, 2 = manual window (ulx/uly/win_width/win_height)
# value = 0

[[stages.overrides]]
name = "ulx" # Upper-left x of the manual sky window, in pixels (rgbskyzero_method = 2)
# value = 1000

[[stages.overrides]]
name = "uly" # Upper-left y of the manual sky window, in pixels (rgbskyzero_method = 2)
# value = 1000

[[stages.overrides]]
name = "win_width" # Sky window width in pixels for methods 1 and 2. Too small is noisy, too large picks up sky glow
# value = 500

[[stages.overrides]]
name = "win_height" # Sky window height in pixels for methods 1 and 2. Around 700 px per side is a good start for a 45 MP frame
# value = 700

[[stages.overrides]]
name = "win_frac" # Auto-scan step granularity: the window is stepped by its own size / win_frac. 1 is fastest/roughest, 10 is more accurate
# value = 10

[[stages.overrides]]
name = "scurve" # Number of S-curve passes, 0-4: 0 = none, 1 = s1 (contrast), 2 = s1+s2 (brighter), 3 = s1+s2+s1, 4 = s1+s2+s1+s2
# value = 1

[[stages.overrides]]
name = "color_correction_type" # Colour restore method: 0 = none, 1 = ratio (default), 2 = HSV
# value = 1

[[stages.overrides]]
name = "colorenhance" # Colour enhancement strength: 0.0-2.0. 1.0 is the neutral value
# value = 1.0

[[stages.overrides]]
name = "gamma" # Gamma exponent for the HSV colour method: 0.1-10.0. Lower = saturation boost concentrated in bright areas
# value = 5.0

[[stages.overrides]]
name = "hsv_adjust" # Enable the manual HSV adjust step (hue/sat/value/vibrance)
# value = false

[[stages.overrides]]
name = "hue_adjust" # Hue rotation in degrees, -180 to 180 (hsv_adjust only)
# value = 0

[[stages.overrides]]
name = "sat_adjust" # Saturation multiplier, 0.0-2.0 (hsv_adjust only). 1.0 = unchanged
# value = 1.0

[[stages.overrides]]
name = "val_adjust" # Value/brightness multiplier, 0.1-2.0 (hsv_adjust only). 1.0 = unchanged
# value = 1.0

[[stages.overrides]]
name = "vib_adjust" # Vibrance, -1.0 to 1.0 (hsv_adjust only). Protects already-saturated colours; 0.0 = off
# value = 0.0

[[stages.overrides]]
name = "setmin" # Apply a minimum level to each channel so no pixels are crushed to pure black
# value = false

[[stages.overrides]]
name = "setminr" # Minimum red level in DN when setmin is on: 0-20000
# value = 4096

[[stages.overrides]]
name = "setming" # Minimum green level in DN when setmin is on: 0-20000
# value = 4096

[[stages.overrides]]
name = "setminb" # Minimum blue level in DN when setmin is on: 0-20000
# value = 4096

[[stages.overrides]]
name = "wb_mode" # White balance: 0 = none (default), 1 = gray-world, 2 = temperature/tint
# value = 0

[[stages.overrides]]
name = "temp" # White balance temperature factor, 0.8-1.2 (wb_mode = 2). Above 1.0 warms, below cools
# value = 1.0

[[stages.overrides]]
name = "tint" # White balance tint factor, 0.7-1.3 (wb_mode = 2). Above 1.0 moves toward magenta, below toward green
# value = 1.0

[[stages.overrides]]
name = "ca_correct" # Align the red and blue channels onto green to reduce star chromatic aberration
# value = true

[[stages.overrides]]
name = "vn_correct" # Subtract a fitted radial vignetting pattern from each channel
# value = false

[[stages.overrides]]
name = "vn_strength" # Vignetting correction strength as a percentage, 0-100 (vn_correct only)
# value = 30

[[stages.overrides]]
name = "lg_correct" # Subtract a fitted linear/planar gradient from each channel
# value = false

[[stages.overrides]]
name = "lg_strength" # Gradient correction strength as a percentage, 0-100 (lg_correct only)
# value = 100

[[stages.overrides]]
name = "star_reduction" # Shrink star halos while preserving bright cores (post-stretch)
# value = false

[[stages.overrides]]
name = "reduction_strength" # Star halo reduction strength, 0.0 (none) to 1.0 (full) (star_reduction only)
# value = 1.0

[[stages.overrides]]
name = "rl_deconvolve" # Apply Richardson-Lucy deconvolution on the luminance channel (post-stretch)
# value = false

[[stages.overrides]]
name = "rl_iterations" # Richardson-Lucy iterations, 1-40 (rl_deconvolve only). More sharpens harder and amplifies noise
# value = 15

[[stages.overrides]]
name = "psf_sigma" # Gaussian-equivalent PSF sigma for deconvolution, 0.1-3.0 (rl_deconvolve only)
# value = 0.8
[[stages]]
name = "grax-denoise" # Do denoising with graxpert
[processing.citation]

# Summary information for each session processed.  Included with sessions is [stages] which allows per session
# recipe exclusions/inclusions to be specified.
